<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECNA ARC - Mimarlık & İç Mimarlık</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .hero { background: linear-gradient(135deg, #1e293b, #0f172a); color: white; padding: 60px 0; border-radius: 0 0 20px 20px; }
        .chat-box { height: 350px; overflow-y: auto; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 15px; }
        .user-msg { background: #e0f2fe; color: #0369a1; padding: 8px 12px; border-radius: 10px; margin-bottom: 8px; text-align: right; width: fit-content; margin-left: auto; }
        .ai-msg { background: #f1f5f9; color: #334155; padding: 8px 12px; border-radius: 10px; margin-bottom: 8px; width: fit-content; }
    </style>
</head>
<body>
    <div class="hero text-center mb-5">
        <h1 class="display-4 fw-bold">ECNA ARC</h1>
        <p class="lead">Mimarlık & İç Mimarlık Danışmanlığı</p>
    </div>

    <div class="container mb-5">
        <div class="row g-4">
            <!-- AI Sohbet Bölümü -->
            <div class="col-md-7">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white fw-bold">🏛️ Yapay Zekâ Mimari Asistanı</div>
                    <div class="card-body">
                        <div id="chatBox" class="chat-box mb-3">
                            <div class="ai-msg">Merhaba! Ben ECNA ARC dijital asistanı. Projeleriniz ve iç mimarlık danışmanlığımız hakkında size nasıl yardımcı olabilirim?</div>
                        </div>
                        <div class="input-group">
                            <input type="text" id="userInput" class="form-control" placeholder="Sorunuzu buraya yazın...">
                            <button class="btn btn-dark" onclick="mesajGonder()">Gönder</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- İletişim Formu -->
            <div class="col-md-5">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white fw-bold">📋 Randevu & Proje Teklifi Alın</div>
                    <div class="card-body">
                        <form id="leadForm">
                            <div class="mb-3">
                                <label class="form-label">Adınız Soyadınız</label>
                                <input type="text" id="isim" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Telefon Numaranız</label>
                                <input type="tel" id="telefon" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Proje Tipi</label>
                                <select id="proje_tipi" class="form-select">
                                    <option value="Konut Tasarımı">Konut Tasarımı</option>
                                    <option value="İç Mimarlık & Dekorasyon">İç Mimarlık & Dekorasyon</option>
                                    <option value="Ticari Mekan Tasarımı">Ticari Mekan Tasarımı</option>
                                    <option value="Danışmanlık">Danışmanlık</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Not / Mesajınız</label>
                                <textarea id="mesaj" class="form-control" rows="2"></textarea>
                            </div>
                            <button type="button" class="btn btn-success w-100" onclick="formGonder()">Talep Gönder</button>
                        </form>
                        <div id="formSonuc" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function mesajGonder() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const mesaj = input.value.trim();
            if(!mesaj) return;

            chatBox.innerHTML += `<div class="user-msg">${mesaj}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // ADRES DÜZELTİLDİ: /api/sohbet yerine /api/chat yapıldı
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ mesaj: mesaj })
            });
            const data = await res.json();
            if(data.basari) {
                chatBox.innerHTML += `<div class="ai-msg">${data.cevap}</div>`;
            } else {
                chatBox.innerHTML += `<div class="ai-msg text-danger">${data.response || 'Hata oluştu.'}</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function formGonder() {
            const isim = document.getElementById('isim').value;
            const telefon = document.getElementById('telefon').value;
            const proje_tipi = document.getElementById('proje_tipi').value;
            const mesaj = document.getElementById('mesaj').value;
            const sonucDiv = document.getElementById('formSonuc');

            if(!isim || !telefon) {
                sonucDiv.innerHTML = `<div class="alert alert-warning">Lütfen isim ve telefon doldurun.</div>`;
                return;
            }

            const res = await fetch('/api/leads', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ isim, telefon, proje_tipi, mesaj })
            });
            const data = await res.json();
            if(data.basari) {
                sonucDiv.innerHTML = `<div class="alert alert-success">Talebiniz başarıyla iletildi!</div>`;
                document.getElementById('leadForm').reset();
            } else {
                sonucDiv.innerHTML = `<div class="alert alert-danger">Bir hata oluştu.</div>`;
            }
        }
</script>
