<!--
  ECNA ARC - Wix'e gomulecek chatbot bileseni.

  Wix Editor > Ekle > Katistir (Embed) > HTML iframe > "Kodu Girin"
  alanina bu dosyanin TAMAMI yapistirilir.

  KRITIK: Asagidaki API_ADRESI mutlak (absolute) olmalidir. Wix icinde
  "/api/sohbet" gibi goreli bir adres kullanilirsa istek Render'a degil
  Wix alan adina gider ve 404 doner - chatbot bu yuzden calismaz.
-->
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; background: #f8fafc; }
  #kutu { display: flex; flex-direction: column; height: 100vh; min-height: 420px; background: #fff;
          border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; }
  #baslik { background: #1e293b; color: #fff; padding: 14px 16px; font-size: 15px; font-weight: 600; }
  #mesajlar { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .balon { max-width: 80%; padding: 10px 14px; border-radius: 14px; line-height: 1.45;
           font-size: 14px; white-space: pre-wrap; word-wrap: break-word; }
  .kullanici { align-self: flex-end; background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
  .yapayzeka { align-self: flex-start; background: #f1f5f9; color: #0f172a; border-bottom-left-radius: 4px; }
  .hata { background: #fee2e2; color: #991b1b; }
  #alt { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #e2e8f0; background: #fff; }
  #girdi { flex: 1; padding: 11px 14px; border: 1px solid #cbd5e1; border-radius: 22px;
           font-size: 14px; outline: none; font-family: inherit; }
  #girdi:focus { border-color: #2563eb; }
  #gonder { padding: 11px 22px; border: 0; border-radius: 22px; background: #2563eb; color: #fff;
            font-size: 14px; font-weight: 600; cursor: pointer; }
  #gonder:disabled { background: #94a3b8; cursor: not-allowed; }
</style>
</head>
<body>

<div id="kutu">
  <div id="baslik">ECNA ARC · Yapay Zekâ Asistanı</div>
  <div id="mesajlar"></div>
  <div id="alt">
    <input id="girdi" type="text" placeholder="Mesajınızı yazın..." autocomplete="off">
    <button id="gonder">Gönder</button>
  </div>
</div>

<script>
  // Render sunucunuzun MUTLAK adresi. Kendi adresiniz degisirse burayi guncelleyin.
  const API_ADRESI = "https://ecna-arc-smartlead.onrender.com/api/sohbet";

  const mesajlar = document.getElementById("mesajlar");
  const girdi    = document.getElementById("girdi");
  const gonder   = document.getElementById("gonder");

  // Sunucuya gonderilen/gelen konusma gecmisi (baglami korumak icin)
  const gecmis = [];

  function balonEkle(sinif, metin) {
    const d = document.createElement("div");
    d.className = "balon " + sinif;
    // textContent kullaniliyor: gelen metin HTML olarak yorumlanmaz (XSS korumasi)
    d.textContent = metin;
    mesajlar.appendChild(d);
    mesajlar.scrollTop = mesajlar.scrollHeight;
    return d;
  }

  async function mesajGonder() {
    const metin = girdi.value.trim();
    if (!metin) return;

    balonEkle("kullanici", metin);
    girdi.value = "";
    gonder.disabled = true;

    // Render ucretsiz plani uykuya geciyor; ilk istek 50sn'yi bulabilir
    const bekleyen = balonEkle("yapayzeka", "Yazıyor...");

    try {
      const cevap = await fetch(API_ADRESI, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mesaj: metin, gecmis: gecmis.slice(-8) })
      });

      const veri = await cevap.json();
      const yanit = veri.cevap || "Bir hata oluştu.";

      bekleyen.textContent = yanit;
      if (!veri.basari) {
        bekleyen.classList.add("hata");
      } else {
        gecmis.push({ role: "user", content: metin });
        gecmis.push({ role: "assistant", content: yanit });
      }
    } catch (err) {
      console.error("Sohbet hatasi:", err);
      bekleyen.textContent = "Sunucuya ulaşılamadı. Lütfen tekrar deneyin.";
      bekleyen.classList.add("hata");
    } finally {
      gonder.disabled = false;
      girdi.focus();
      mesajlar.scrollTop = mesajlar.scrollHeight;
    }
  }

  gonder.addEventListener("click", mesajGonder);
  girdi.addEventListener("keydown", (e) => { if (e.key === "Enter") mesajGonder(); });

  balonEkle("yapayzeka", "Merhaba! ECNA ARC Mimarlık asistanıyım. Projeniz hakkında ne sormak istersiniz?");
</script>

</body>
</html>
